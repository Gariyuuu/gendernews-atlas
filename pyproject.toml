[project]
name = "gendernews-atlas"
version = "0.1.0"
description = "Robust longitudinal NLP measurement of gender representation in U.S. news, 1900-1963"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B"]
# E501: long lines are allowed in table-building code; B905: zip() over equal-length
# numpy/pandas columns, strict= adds noise; B007/B023: loop helpers are intentional;
# E701/E702/E731: compact one-liners in the site builder.
ignore = ["E501", "B008", "B905", "B007", "B023", "E701", "E702", "E731"]
